name: Sync to plugins repo

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone plugins repo
        run: |
          git clone https://x-access-token:${{ secrets.PLUGINS_REPO_TOKEN }}@github.com/ordureconnoisseur/plugins.git plugins-repo

      - name: Copy files
        run: |
          # Allowlist, not a strip list. The old cp -r * shipped every tracked
          # file that nobody remembered to strip: 1.22.0 delivered AUDIT.md and
          # GRID_REBUILD_PLAN.md to every install, and the next release would
          # have added DESIGN_SYSTEM.md and 2.7 MB of design-system artboards.
          # Only what the plugin needs at runtime, plus licence and readme.
          rm -rf plugins-repo/plugins/refract
          mkdir -p plugins-repo/plugins/refract
          cp refract.yml refract.js LICENSE README.md plugins-repo/plugins/refract/
          cp -r css fonts img plugins-repo/plugins/refract/

      - name: Commit and push
        run: |
          cd plugins-repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add plugins/refract/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "sync: refract $(git -C .. rev-parse --short HEAD)"
          git push
